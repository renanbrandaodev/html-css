<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        div:hover {
            color:red
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color:rgb(224, 248, 3);
            background-color:green;
            text-align:center;
            width:200px;

        }
        
    </style>

</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse no texto abaixo para ver o efeito de hover</p>
    <div>
        Passe o mouse aqui
    <p>Texto escondido</p>

    </div>
    
</body>
</html>
