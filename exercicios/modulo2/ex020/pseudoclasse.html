<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div {
            display: inline-block;
            text-align:center;
            width:200px;
            height:200px;
            background-color: rgb(91, 91, 92);
            border: 2px solid rgb(0, 0, 0);

        }
        div:hover {
            background-color: rgb(230, 10, 10);
            color: rgb(10, 235, 21);
        }

    </style>
</head>
<body>
    <div>01</div>
    <div>02</div>
    <div>03</div>
    
</body>
</html>
