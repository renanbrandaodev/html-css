<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            border-collapse: collapse;
            width: 300px;
            text-align: center;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }
        
    </style>
</head>
<body>
    <h1>Mesclagem de tabelas</h1>

    <table>
        <tr>
            <td>A</td>
            <td colspan="3">B</td>
            
        </tr>

        <tr>
            <td rowspan="3">E</td>
            <td rowspan="2">F</td>
            <td colspan="2">G</td>
            
        </tr>

        <tr>
            
            
            <td>K</td>
            <td>L</td>

        </tr>

        <tr>
            <td>N</td>
            <td>O</td>
            <td>P</td>
        </tr>
    </table>
    
</body>
</html>
