<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient em CSS</title>
    <style>
        * {
            height:50%;
        }
        body {
            background: radial-gradient(circle, #ADEEC5, #ADEDAF, #ADEDDA, #C6EDAD, #ADEAED);
            background-attachment: fixed;
        }

    </style>
</head>
<body>

</html>
